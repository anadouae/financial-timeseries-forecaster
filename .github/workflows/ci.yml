name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # CPU torch wheel (default on Linux CI)

      - name: Pytest
        env:
          FTS_DEVICE: cpu
        run: pytest -q --tb=short

      - name: Light CPU train smoke
        env:
          FTS_DEVICE: cpu
        run: |
          python -m fts_forecaster.train --smoke --no-mlflow
          test -f artifacts/best_model.pt
