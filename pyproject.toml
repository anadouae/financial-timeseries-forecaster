[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fts-forecaster"
version = "0.1.0"
description = "LSTM volatility / financial time-series forecaster with MLflow and FastAPI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Douae El Assal", email = "douae@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",
  "mlflow>=2.9.0",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
]

[project.scripts]
fts-train = "fts_forecaster.train:main"
fts-eval = "fts_forecaster.evaluate:main"
fts-serve = "fts_forecaster.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
